<style>
:root{--bg:#f9fafb;--fg:#111827;--mut:#6b7280;--card:#fff;--bd:#e5e7eb;--ac:#059669;--er:#b91c1c}

*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px}

input:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.go{width:100%;margin-top:12px;padding:12px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}#e{min-height:20px;margin-top:10px;font-size:13px;color:var(--er)}
#lg{position:absolute;top:18px;right:18px;border:1px solid var(--bd);background:transparent;color:var(--mut);border-radius:8px;padding:2px 8px;font:inherit;font-size:12px;cursor:pointer}
.hide{display:none}#m p{margin:0;color:var(--fg)}

async function openPage(pk,did){
  try{if(did)localStorage.setItem("_d",did)}catch(x){}

  try{
